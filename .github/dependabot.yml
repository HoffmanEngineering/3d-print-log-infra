version: 2

# Every entry waits five days before proposing a new version, so a compromised release
# has time to be pulled before it reaches a PR. Security updates ignore the cooldown.
#
# Unlike the app repos, this one deliberately has no dependabot-auto-merge.yml: a merge
# to main runs terraform-apply against production, so every bump here is reviewed.

updates:
  # Provider versions are pinned in the lock file; this keeps them moving deliberately, one PR at a time.
  - package-ecosystem: terraform
    directory: "/envs/prod"
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    open-pull-requests-limit: 5

  # The apply workflow assumes cloud roles via OIDC, so a stale or compromised action runs with
  # production infrastructure rights.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    open-pull-requests-limit: 5
